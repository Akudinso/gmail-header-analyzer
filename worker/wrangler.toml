name = "gmail-header-analyzer"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Configuration lives in secrets, not here, so this file stays the same for
# everyone who clones the repo:
#   Local:      worker/.dev.vars (written by `npm run setup`; add your API keys there)
#   Deployed:   npx wrangler secret put <NAME> --config worker/wrangler.toml
# Names: WORKER_KEY, ALLOWED_ORIGINS, VT_API_KEY, ABUSEIPDB_API_KEY

[vars]
# How many VirusTotal lookups one email may use. The free tier allows 4/minute.
VT_MAX_LOOKUPS = "4"

# Optional shared cache across Cloudflare locations. Create one with
#   npx wrangler kv namespace create LOOKUP_CACHE --config worker/wrangler.toml
# then uncomment and paste the id:
# [[kv_namespaces]]
# binding = "LOOKUP_CACHE"
# id = "paste-id-here"
